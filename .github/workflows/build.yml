name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build and package
        id: package
        shell: pwsh
        run: |
          ./scripts/build.ps1
          $zip = Get-Item dist/TickPlayer-*.zip
          "version=$($zip.BaseName -replace '^TickPlayer-', '')" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*.zip
          if-no-files-found: error

  # Installs the release on a clean Windows machine with stock VLC and checks
  # thumbnails, install, auto-start and uninstall (scripts/test-release.ps1).
  test:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    name: test (${{ matrix.arch }} VLC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Install VLC (${{ matrix.arch }})
        shell: pwsh
        run: |
          $chocoArgs = @('install', 'vlc', '-y', '--no-progress')
          if ('${{ matrix.arch }}' -eq 'x86') { $chocoArgs += '--x86' }
          choco @chocoArgs
          if ($LASTEXITCODE -ne 0) { throw 'VLC install failed' }

      - name: Test the release
        shell: pwsh
        run: |
          Expand-Archive (Get-Item dist/*.zip) -DestinationPath release
          ./scripts/test-release.ps1 -Release release -Arch ${{ matrix.arch }} -Install

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: |
            ~/AppData/Local/Temp/tickplayer-test-*
            ~/AppData/Local/TickPlayer/*.log
          if-no-files-found: ignore

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match the version in the code ($VERSION)"
            exit 1
          fi
          cd dist
          sha256sum TickPlayer-*.zip > SHA256SUMS.txt
          # Release notes: this version's section of CHANGELOG.md
          # (from "## <version> ..." up to the next "## " heading).
          awk -v v="$VERSION" '
            BEGIN { gsub(/[.]/, "[.]", v); heading = "^## " v "( |$)" }
            /^## / { if (found) exit; if ($0 ~ heading) { found = 1; next } }
            found { print }
          ' ../CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" TickPlayer-*.zip SHA256SUMS.txt \
            --title "TickPlayer $VERSION" --notes-file notes.md $prerelease
